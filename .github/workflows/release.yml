name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: package:mac
            files: |
              release/*.dmg
              release/*.zip
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              release/*.exe
              release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Inset Context Pin $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
      - name: Publish rolling preview from main
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview dist/* \
            --target "$GITHUB_SHA" \
            --title "Preview build (main, ${GITHUB_SHA::7})" \
            --notes-file .github/release-notes.md \
            --prerelease
