appId: ch.inset.prototype.contextpin
productName: Inset Context Pin
artifactName: inset-context-pin-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.png"
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish: null
